name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION:-dev}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/AlterVPN-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: altervpn-release-apk
          path: build/app/outputs/flutter-apk/AlterVPN-*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AlterVPN ${{ github.ref_name }}
          body: |
            ## AlterVPN ${{ github.ref_name }}

            ### Download

            Download **AlterVPN-${{ github.ref_name }}.apk** below and install it on your Android device.

            ### Install Instructions

            1. Download the `.apk` file on your Android device
            2. Open the file — if prompted, enable **"Install from unknown sources"** in Settings
            3. Tap **Install** and open AlterVPN

            > **Minimum Android version:** 5.0 (API 21)
          files: build/app/outputs/flutter-apk/AlterVPN-*.apk
          draft: false
          prerelease: false
