plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Paths in keystore.properties are relative to android/app (see keystore.properties.example).
def releaseKeystoreFile = keystoreProperties["storeFile"] != null
        ? file(keystoreProperties["storeFile"])
        : null
def hasReleaseKeystore = keystorePropertiesFile.exists()
        && releaseKeystoreFile != null
        && releaseKeystoreFile.exists()
        && keystoreProperties["keyAlias"] != null
        && keystoreProperties["storePassword"] != null
        && keystoreProperties["keyPassword"] != null

android {
    namespace "com.altervpn.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.altervpn.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile releaseKeystoreFile
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // CI / local builds without keystore.properties: use debug keys so `flutter build apk --release` works.
            // Play Store: add android/keystore.properties + .jks (see keystore.properties.example) or use build-aab.yml secrets.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
        }
    }
}

// Use split Play libraries — monolithic play:core is rejected for targetSdk 34+ (Play Console).
dependencies {
    implementation "com.google.android.play:app-update-ktx:2.1.0"
    implementation "com.google.android.play:review-ktx:2.0.1"
}

flutter {
    source "../.."
}
