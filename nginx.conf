server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── VPNGate relay ─────────────────────────────────────────────────────────
    # Proxies /api/iphone/ to the upstream VPNGate CSV endpoint so the mobile
    # app can fetch server lists through this backend even when vpngate.net is
    # blocked in the user's region (e.g. UAE).
    location /api/iphone/ {
        proxy_pass https://www.vpngate.net/api/iphone/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.vpngate.net;
        proxy_set_header User-Agent "AlterVPN/1.0";
        proxy_connect_timeout 15s;
        proxy_read_timeout    45s;
        proxy_send_timeout    15s;
        # Do not cache at the proxy layer — the app handles its own 30-min cache.
        # 'always' ensures the header is set even for error responses (4xx/5xx).
        add_header Cache-Control "no-store" always;
    }
    # ─────────────────────────────────────────────────────────────────────────

    # Gzip compression for Flutter web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/woff
        font/woff2
        image/svg+xml;

    # Long-lived cache for content-hashed assets (JS, Wasm, CSS, fonts, images)
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for index.html — browser must always re-fetch the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA routing — fall back to index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
