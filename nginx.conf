server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Clean JSON server list ────────────────────────────────────────────────
    # US + UK entries for the AlterVPN mobile app. Each ovpn_url points to a
    # static .ovpn under /configs/ (see Dockerfile COPY configs).
    #
    # Response shape: { "servers": [ { ... "ovpn_url": "https://<host>/configs/..." } ] }
    location = /api/iphone/ {
        default_type application/json;
        # Explicit Content-Type prevents proxy/CDN from guessing the format.
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
        # $scheme and $host are nginx variables interpolated at request time.
        # They are intentionally NOT in NGINX_ENVSUBST_VARS so envsubst leaves
        # them untouched and nginx substitutes them dynamically per request.
        return 200 '{"servers":[{"id":"us_northbergen","name":"US - North Bergen","countryLong":"United States","countryShort":"US","city":"North Bergen","active":true,"ovpn_url":"$scheme://$host/configs/us_northbergen.ovpn"},{"id":"uk_london","name":"UK - London","countryLong":"United Kingdom","countryShort":"GB","city":"London","active":true,"ovpn_url":"$scheme://$host/configs/uk_london.ovpn"}]}';
    }
    # ─────────────────────────────────────────────────────────────────────────

    # ── Static OpenVPN config files ───────────────────────────────────────────
    # Serves .ovpn profiles as plain text so the app can download them via
    # the ovpn_url field returned by /api/iphone/.
    # Replace configs/*.ovpn with real profiles before deploying (US + EU).
    location /configs/ {
        # Force plain text so clients never receive a binary/compressed blob.
        types { }
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
    }
    # ─────────────────────────────────────────────────────────────────────────

    # Gzip compression for Flutter web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/woff
        font/woff2
        image/svg+xml;

    # Long-lived cache for content-hashed assets (JS, Wasm, CSS, fonts, images)
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for index.html — browser must always re-fetch the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA routing — fall back to index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
